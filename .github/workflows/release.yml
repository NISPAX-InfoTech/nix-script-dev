name: Package and verify NixScript installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish (must already exist)
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Native desktop installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.0-beta.1') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify release source is on main
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then source_ref="$INPUT_TAG"; else source_ref="$REF_NAME"; fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$source_ref" origin/main; then
            echo "Refusing to package a commit not reachable from main: $source_ref" >&2
            exit 1
          fi
      - name: Configure release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build CLI
        run: cmake --build build --config Release --parallel
      - name: Smoke-test CLI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          actual="$(./build/nix examples/hello.ns | tr -d '\r')"
          expected="$(printf 'Hello, NixScript!\nHello, NixScript!\n50\nKeep building!\nKeep building!\nKeep building!')"
          [[ "$actual" == "$expected" ]]
      - name: Smoke-test CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = ((& .\build\Release\nix.exe examples\hello.ns) -join "`n") -replace "`r", ""
          if ($LASTEXITCODE -ne 0) { throw "NixScript smoke test failed with exit code $LASTEXITCODE" }
          $expected = "Hello, NixScript!`nHello, NixScript!`n50`nKeep building!`nKeep building!`nKeep building!"
          if ($actual -ne $expected) { throw "Unexpected CLI output: $actual" }
      - name: Smoke-test CLI on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          actual="$(./build/nix examples/hello.ns)"
          expected="$(printf 'Hello, NixScript!\nHello, NixScript!\n50\nKeep building!\nKeep building!\nKeep building!')"
          [[ "$actual" == "$expected" ]]
      - name: Package Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python installer/build_brand_assets.py
          New-Item -ItemType Directory -Force -Path dist\root\examples | Out-Null
          Copy-Item .\build\Release\nix.exe dist\root\nix.exe
          Copy-Item .\README.md, .\LANGUAGE.md dist\root\
          Copy-Item .\examples\hello.ns dist\root\examples\hello.ns
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5
          wix extension add --global WixToolset.Util.wixext/4.0.5
          $msiVersion = "1.0.0"
          if ($env:VERSION -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') { $msiVersion = $Matches[1] }
          wix build .\installer\nixscript.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d "BuildDir=$env:GITHUB_WORKSPACE\dist\root" -d "BrandDir=$env:GITHUB_WORKSPACE\installer\brand-output" -d "ProductVersion=$msiVersion" -o .\nixscript-windows-x64.msi
          Move-Item .\nixscript-windows-x64.msi .\dist\nixscript-windows-x64.msi
      - name: Package Linux DEB and RPM
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ env.VERSION_TAG }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
          version="${TAG#v}"
          base_version="${version%%-*}"
          rpm_release="${version#"$base_version"}"
          rpm_release="${rpm_release#-}"
          if [[ -z "$rpm_release" ]]; then rpm_iteration="1"; else rpm_iteration="0.${rpm_release//./_}"; fi
          root="dist/pkgroot"
          install -d "$root/usr/bin" "$root/usr/share/doc/nixscript" "$root/usr/share/nixscript/examples" "$root/etc/profile.d"
          install -m 0755 build/nix "$root/usr/bin/nix"
          install -m 0644 README.md LANGUAGE.md "$root/usr/share/doc/nixscript/"
          cp -R examples/. "$root/usr/share/nixscript/examples/"
          install -m 0644 installer/linux/nixscript.sh "$root/etc/profile.d/nixscript.sh"
          fpm -s dir -t deb -n nixscript -v "$version" --architecture amd64 --description "NixScript programming language interpreter" --maintainer "NISPAX InfoTech" --url "https://github.com/NISPAX-InfoTech/nix-script-dev" --after-install "$GITHUB_WORKSPACE/installer/linux/postinst.sh" -p "$GITHUB_WORKSPACE/dist/nixscript-linux-x64.deb" -C "$root" usr etc
          fpm -s dir -t rpm -n nixscript -v "$base_version" --iteration "$rpm_iteration" --architecture x86_64 --description "NixScript programming language interpreter" --maintainer "NISPAX InfoTech" --url "https://github.com/NISPAX-InfoTech/nix-script-dev" --after-install "$GITHUB_WORKSPACE/installer/linux/postinst.sh" -p "$GITHUB_WORKSPACE/dist/nixscript-linux-x64.rpm" -C "$root" usr etc
      - name: Package macOS PKG
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG: ${{ env.VERSION_TAG }}
        run: |
          set -euo pipefail
          full_version="${TAG#v}"
          version="${full_version%%-*}"
          arch="$(uname -m)"
          if [[ "$arch" == "arm64" ]]; then package_arch="arm64"; else package_arch="x64"; fi
          root="dist/macos-root"
          install -d "$root/usr/local/bin" "$root/usr/local/share/nixscript/examples" "$root/etc/paths.d"
          install -m 0755 build/nix "$root/usr/local/bin/nix"
          install -m 0644 README.md LANGUAGE.md "$root/usr/local/share/nixscript/"
          cp -R examples/. "$root/usr/local/share/nixscript/examples/"
          printf '/usr/local/bin\n' > "$root/etc/paths.d/nixscript"
          pkgbuild --root "$root" --identifier com.nispax.nixscript --version "$version" --install-location / --scripts installer/macos --ownership recommended "$GITHUB_WORKSPACE/dist/nixscript-macos-$package_arch.pkg"
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/nixscript-windows-x64.msi
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/nixscript-linux-x64.deb
            dist/nixscript-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/nixscript-macos-*.pkg
          if-no-files-found: error
          retention-days: 14

  vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build VSIX
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce package --no-dependencies --out "$GITHUB_WORKSPACE/nixscript-vscode.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: nixscript-vscode.vsix
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android SDK/NDK and artwork tooling
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          python -m pip install --disable-pip-version-check Pillow
          python tools/prepare_brand_assets.py
      - name: Detect release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nixscript-release.jks"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android-ide
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nixscript-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Build debug fallback APK
        if: steps.signing.outputs.available != 'true'
        working-directory: android-ide
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Stage APK and signing note
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          mkdir -p dist
          if [[ "$SIGNED" == "true" ]]; then
            cp android-ide/app/build/outputs/apk/release/app-release.apk dist/nixscript-android.apk
            printf 'APK signing: configured release keystore\n' > dist/APK-SIGNING.txt
          else
            cp android-ide/app/build/outputs/apk/debug/app-debug.apk dist/nixscript-android-debug.apk
            printf 'APK signing: Android debug key (preview only)\n' > dist/APK-SIGNING.txt
          fi
          sha256sum dist/*.apk > dist/SHA256-APK.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish installer release assets
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [desktop, vscode, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic-version tag such as v1.0.0-beta.1; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Verify installer payload and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.msi release-assets/*.deb release-assets/*.rpm release-assets/*.pkg release-assets/*.apk release-assets/*.vsix)
          (("${#files[@]}" >= 6))
          sha256sum "${files[@]}" > release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          ls -lh release-assets
      - name: Publish to official releases repository
        env:
          GH_TOKEN: ${{ secrets.NIXSCRIPT_RELEASE_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_REPOSITORY: NISPAX-InfoTech/nix-script
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing NIXSCRIPT_RELEASE_TOKEN secret with Contents: read/write access to $RELEASE_REPOSITORY." >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --repo "$RELEASE_REPOSITORY" --target main --title "NixScript $TAG" --generate-notes
