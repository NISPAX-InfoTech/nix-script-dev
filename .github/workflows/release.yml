name: Package CLI release

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (must already exist)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nix-linux-x64
          - os: windows-latest
            artifact_name: nix-windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI
        run: cmake --build build --config Release --parallel

      - name: Smoke test CLI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="./build/Release/nix.exe"
          else
            BIN="./build/nix"
          fi
          actual="$("$BIN" examples/hello.ns | tr -d '\r')"
          expected="$(printf 'Hello, NixScript!\nHello, NixScript!\n50\nKeep building!\nKeep building!\nKeep building!')"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected smoke-test output:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Package Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/nixscript
          cp build/nix dist/nixscript/nix
          cp README.md LANGUAGE.md dist/nixscript/
          cp -R examples dist/nixscript/
          tar -C dist -czf nixscript-linux-x64.tar.gz nixscript

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/nixscript | Out-Null
          Copy-Item build/Release/nix.exe dist/nixscript/nix.exe
          Copy-Item README.md, LANGUAGE.md dist/nixscript/
          Copy-Item examples dist/nixscript/examples -Recurse
          Compress-Archive -Path dist/nixscript -DestinationPath nixscript-windows-x64.zip

      - name: Upload packaged CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            nixscript-linux-x64.tar.gz
            nixscript-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download packaged CLIs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nix-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -s release-assets/nixscript-linux-x64.tar.gz
          test -s release-assets/nixscript-windows-x64.zip
          sha256sum release-assets/nixscript-linux-x64.tar.gz release-assets/nixscript-windows-x64.zip > release-assets/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/nixscript-linux-x64.tar.gz release-assets/nixscript-windows-x64.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "NixScript $TAG" \
            --generate-notes
