<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#242424">
<style>
:root{color-scheme:dark;--bg:#303030;--bar:#242424;--text:#d5d5d5;--muted:#888;--orange:#d88743;--blue:#82b6e7;--green:#83b66b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Roboto,"Arial",sans-serif}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.top{height:76px;min-height:76px;background:var(--bar);display:flex;align-items:center;padding:0 22px 0 27px;gap:22px}
.brand{flex:1;min-width:0;font-size:29px;line-height:1.05;font-weight:400;letter-spacing:-.5px}
.status{font-size:19px;display:block;color:#bcbcbc;margin-top:7px;letter-spacing:0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action{border:0;background:transparent;color:#f5f5f5;font-size:21px;font-weight:400;padding:12px 0 12px 14px}
#menu{display:none;position:absolute;z-index:10;right:8px;top:65px;min-width:205px;padding:6px;background:#252525;border:1px solid #555;box-shadow:0 8px 24px #0009}
#menu button{display:block;width:100%;text-align:left;color:#eee;background:transparent;border:0;padding:14px;font-size:15px}
#menu button:active,.symbols button:active{background:#444}
.editor-wrap{flex:1;min-height:0;position:relative;display:flex;overflow:hidden;font:25px/1.56 "Roboto Mono","Droid Sans Mono",monospace}
#gutter{width:64px;flex-shrink:0;text-align:right;padding:4px 8px 8px 0;color:#888;white-space:pre;overflow:hidden;user-select:none;border-right:1px solid #555;line-height:1.56}
#edit{flex:1;min-width:0;position:relative;overflow:hidden}
#highlight,#code{margin:0;padding:4px 12px 24px 0;font:inherit;line-height:1.56;letter-spacing:0;white-space:pre;tab-size:4}
#highlight{pointer-events:none;min-height:100%;color:var(--text);overflow:visible}
#code{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:transparent;caret-color:#fff;-webkit-text-fill-color:transparent;overflow:auto;white-space:pre;tab-size:4}
#code::selection{background:#597a9a88}
.kw{color:var(--orange)}.num{color:var(--blue)}.str{color:var(--green)}.comment{color:#8b8b8b}.fn{color:#b5a0d5}
#output{display:none;max-height:30%;flex-shrink:0;overflow:auto;background:#282828;border-top:1px solid #4a4a4a;padding:10px 14px;font:16px/1.5 "Roboto Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#output.visible{display:block}.output-head{display:flex;justify-content:space-between;color:#aaa;font:13px Arial,sans-serif;margin-bottom:8px}
.symbols{background:#292929;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:3px 2px calc(3px + env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid #414141}
.symbols button{height:42px;color:#c8c8c8;background:transparent;border:0;font-size:19px;padding:0}
@media(max-width:500px){.top{padding-left:18px;padding-right:16px;gap:17px}.brand{font-size:25px}.status{font-size:16px}.action{font-size:18px}.editor-wrap{font-size:20px}#gutter{width:47px;padding-right:7px}.symbols button{height:38px;font-size:17px}}
</style>
</head>
<body><div id="app">
<header class="top"><div class="brand">NixScript<span class="status" id="status">Ready</span></div><button class="action" id="run">RUN</button><button class="action" id="menuButton">MENU</button></header>
<div id="menu">
<button id="newFile">New file</button><button id="saveFile">Download .ns file</button><button id="loadFile">Open .ns file</button><button id="clearOutput">Clear output</button><button id="about">About NixScript</button><input id="filePicker" type="file" accept=".ns,.txt,text/plain" hidden>
</div>
<section class="editor-wrap"><div id="gutter">1</div><div id="edit"><pre id="highlight" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="NixScript code"></textarea></div></section>
<section id="output"><div class="output-head"><span>OUTPUT</span><button id="closeOutput" style="background:none;border:0;color:#aaa">CLOSE</button></div><div id="outputText"></div></section>
<nav class="symbols">
<button data-insert="    " title="Indent">Tab</button><button data-insert="{}">{}</button><button data-insert="&quot;&quot;">“”</button><button data-insert=";">;</button><button data-insert="()">↶</button><button data-insert="⇧">⇧</button><button data-insert="↻">↻</button>
<button data-insert="=">=</button><button data-insert="\">\</button><button data-insert="&amp;">&amp;</button><button data-insert=",">,</button><button data-insert="←">⇦</button><button data-insert="↓">↓</button><button data-insert="→">⇨</button>
</nav></div>
<script>
const code=document.getElementById('code'),highlight=document.getElementById('highlight'),gutter=document.getElementById('gutter'),output=document.getElementById('output'),outputText=document.getElementById('outputText'),status=document.getElementById('status'),menu=document.getElementById('menu');
const starter='nix main() {\n    print("Hello from NixScript!");\n    var answer = 40 + 2;\n    print(answer);\n}\n';
code.value=starter;
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function paint(){let s=escapeHtml(code.value);s=s.replace(/(\/\/.*)$/gm,'<span class="comment">$1</span>');s=s.replace(/(&quot;.*?&quot;)/g,'<span class="str">$1</span>');s=s.replace(/\b(nix|main|var|class|public|private|protected|static|return|if|else|for|repeat|true|false|null|this|use)\b/g,'<span class="kw">$1</span>');s=s.replace(/\b(print|uin|sqrt|sq|pow|abs|floor|ceil|round|isUpper|isLower|toUpper|toLower|isSpace)\b/g,'<span class="fn">$1</span>');s=s.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');highlight.innerHTML=s+'\n';gutter.textContent=Array.from({length:Math.max(1,code.value.split('\n').length)},(_,i)=>i+1).join('\n');syncScroll()}
function syncScroll(){highlight.style.transform='translateY('+(-code.scrollTop)+'px)';gutter.scrollTop=code.scrollTop}
code.addEventListener('input',()=>{paint();status.textContent='Edited'});code.addEventListener('scroll',syncScroll);
code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();insertText('    ')}if(e.key==='Enter'){const p=code.selectionStart,line=code.value.slice(0,p).split('\n').pop(),indent=(line.match(/^\s*/)||[''])[0];if(indent){e.preventDefault();insertText('\n'+indent)}}});
function insertText(text){const a=code.selectionStart,b=code.selectionEnd;code.setRangeText(text,a,b,'end');code.focus();paint()}
document.querySelectorAll('[data-insert]').forEach(b=>b.addEventListener('click',()=>{const v=b.getAttribute('data-insert');if(['⇧','↻','←','↓','→'].includes(v))return;insertText(v.replace(/&amp;/g,'&').replace(/&quot;/g,'"'))}));
document.getElementById('run').addEventListener('click',()=>{status.textContent='Running…';output.classList.add('visible');outputText.textContent='';menu.style.display='none';setTimeout(()=>{try{const result=window.Nix.run(code.value);outputText.textContent=result;status.textContent='Finished'}catch(e){outputText.textContent=String(e);status.textContent='Error'}},20)});
document.getElementById('menuButton').onclick=()=>menu.style.display=menu.style.display==='block'?'none':'block';
document.getElementById('newFile').onclick=()=>{code.value='nix main() {\n    \n}\n';paint();status.textContent='New file';menu.style.display='none'};
document.getElementById('saveFile').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code.value],{type:'text/plain'}));a.download='main.ns';a.click();URL.revokeObjectURL(a.href);menu.style.display='none'};
document.getElementById('loadFile').onclick=()=>document.getElementById('filePicker').click();
document.getElementById('filePicker').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{code.value=String(r.result);paint();status.textContent=f.name};r.readAsText(f);menu.style.display='none'};
document.getElementById('clearOutput').onclick=()=>{outputText.textContent='';output.classList.remove('visible');menu.style.display='none'};
document.getElementById('closeOutput').onclick=()=>output.classList.remove('visible');
document.getElementById('about').onclick=()=>{output.classList.add('visible');outputText.textContent='NixScript IDE\nWrite and run .ns programs on your device.';menu.style.display='none'};
paint();
</script></body></html>
