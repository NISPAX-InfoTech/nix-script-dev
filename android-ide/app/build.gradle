plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nixscript.ide'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nixscript.ide'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
